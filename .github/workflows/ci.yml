name: CI

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VW_CMAKE_VERSION: 4.4.0
  VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
  VW_LLVM_VERSION: 20

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang]
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v6

      - name: Export cache tokens for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DVW_WARNINGS_AS_ERRORS=ON
          ${{ matrix.compiler == 'clang' && '-DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang++' || '' }}
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Export cache tokens for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure without a GPU
        run: >
          cmake -B build-headless -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVW_BUILD_GFX=OFF -DVW_BUILD_APPS=OFF
          -DVW_WARNINGS_AS_ERRORS=ON
          -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build-headless

      - name: Test
        run: ctest --test-dir build-headless --output-on-failure

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Export cache tokens for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.VW_LLVM_VERSION }}
          sudo apt-get install -y \
            libc++-${{ env.VW_LLVM_VERSION }}-dev \
            libc++abi-${{ env.VW_LLVM_VERSION }}-dev
          echo "CC=clang-${{ env.VW_LLVM_VERSION }}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${{ env.VW_LLVM_VERSION }}" >> "$GITHUB_ENV"

      - name: Install windowing dependencies
        run: |
          sudo apt-get install -y \
            xorg-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev \
            libglu1-mesa-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            extra-cmake-modules pkg-config

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=clang-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
          -DVW_WARNINGS_AS_ERRORS=ON
          -DVCPKG_TARGET_TRIPLET=x64-linux-libcxx
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Show vcpkg failure logs
        if: failure()
        run: |
          logs=$(ls -t vcpkg/buildtrees/*/*-err.log vcpkg/buildtrees/*/*-out.log 2>/dev/null | head -6)
          if [ -z "$logs" ]; then
            echo "::error::vcpkg left no build logs — the failure is outside port builds"
            exit 0
          fi
          for f in $logs; do
            echo "::group::$f"
            tail -100 "$f"
            echo "::endgroup::"
          done

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Interface hygiene
        run: python scripts/lint_modules.py
