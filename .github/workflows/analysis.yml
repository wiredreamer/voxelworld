name: Analysis

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VW_CMAKE_VERSION: 4.4.0
  VW_LLVM_VERSION: 20

jobs:
  sanitizers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: address-undefined
            flags: '-fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer'
          - name: thread
            flags: '-fsanitize=thread -fno-omit-frame-pointer'

    name: sanitizers (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.VW_LLVM_VERSION }}
          sudo apt-get install -y \
            libc++-${{ env.VW_LLVM_VERSION }}-dev \
            libc++abi-${{ env.VW_LLVM_VERSION }}-dev

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_C_COMPILER=clang-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ ${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ ${{ matrix.flags }}"
          -DVW_BUILD_GFX=OFF -DVW_BUILD_APPS=OFF

      - name: Build
        run: cmake --build build

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
          LSAN_OPTIONS: report_objects=1
        run: ctest --test-dir build --output-on-failure

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.VW_LLVM_VERSION }}
          sudo apt-get install -y \
            libc++-${{ env.VW_LLVM_VERSION }}-dev \
            libc++abi-${{ env.VW_LLVM_VERSION }}-dev

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Configure
        run: >
          cmake -B build-fuzz -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_C_COMPILER=clang-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -fsanitize=address,undefined"
          -DVW_BUILD_GFX=OFF -DVW_BUILD_APPS=OFF -DVW_BUILD_TESTS=OFF
          -DVW_BUILD_FUZZERS=ON

      - name: Build
        run: cmake --build build-fuzz

      - name: Fuzz the .vox parser
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >
          mkdir -p corpus/vox &&
          ./build-fuzz/tests/fuzz/vox_parse_fuzzer
          -max_total_time=60 -print_final_stats=1 -artifact_prefix=vox-
          corpus/vox assets/models

      - name: Fuzz the .voxa parser
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >
          mkdir -p corpus/voxa &&
          ./build-fuzz/tests/fuzz/voxa_parse_fuzzer
          -max_total_time=60 -print_final_stats=1 -artifact_prefix=voxa-
          corpus/voxa assets/animations

      - name: Fuzz the JSON parser
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >
          mkdir -p corpus/json &&
          ./build-fuzz/tests/fuzz/json_parse_fuzzer
          -max_total_time=60 -print_final_stats=1 -artifact_prefix=json-
          corpus/json tests/data/json_test_suite/test_parsing

      - name: Fuzz the HTTP head parser
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: >
          mkdir -p corpus/http &&
          ./build-fuzz/tests/fuzz/http_head_fuzzer
          -max_total_time=60 -print_final_stats=1 -artifact_prefix=http-
          corpus/http tests/data/http_heads

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            vox-*
            voxa-*
            json-*
            http-*
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.VW_LLVM_VERSION }}
          sudo apt-get install -y \
            libc++-${{ env.VW_LLVM_VERSION }}-dev \
            libc++abi-${{ env.VW_LLVM_VERSION }}-dev

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Configure
        run: >
          cmake -B build-cov -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DCMAKE_CXX_COMPILER=clang++-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_C_COMPILER=clang-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_FLAGS="-stdlib=libc++ -fprofile-instr-generate -fcoverage-mapping"
          -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -fprofile-instr-generate"
          -DVW_BUILD_GFX=OFF -DVW_BUILD_APPS=OFF

      - name: Build
        run: cmake --build build-cov

      - name: Test
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/prof/%p.profraw
        run: ctest --test-dir build-cov --output-on-failure

      - name: Report
        run: |
          profdata=llvm-profdata-${{ env.VW_LLVM_VERSION }}
          cov=llvm-cov-${{ env.VW_LLVM_VERSION }}
          $profdata merge -sparse prof/*.profraw -o merged.profdata

          test_targets="core_tests asset_tests net_tests ecs_tests world_tests game_tests"

          first=""
          objects=""
          for target in $test_targets; do
            if [ -z "$first" ]; then
              first="build-cov/tests/$target"
            else
              objects="$objects -object build-cov/tests/$target"
            fi
          done

          skip='.*(vcpkg_installed|_deps|/tests/).*'

          {
            echo '## Покрытие headless-ядра'
            echo
            echo '```'
            $cov report $first $objects -instr-profile=merged.profdata \
              -ignore-filename-regex="$skip" engine
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          $cov show $first $objects -instr-profile=merged.profdata \
            -ignore-filename-regex="$skip" -format=html -o coverage-html engine

      - name: Upload the line-by-line report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage-html

  asan-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Export cache tokens for vcpkg
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        env:
          VCPKG_BINARY_SOURCES: 'clear;x-gha,readwrite'
        run: >
          cmake -B build-asan -S . -G Ninja
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DVW_BUILD_APPS=OFF
          -DCMAKE_DISABLE_FIND_PACKAGE_Catch2=ON
          -DCMAKE_CXX_FLAGS_INIT="/fsanitize=address"
          -DCMAKE_EXE_LINKER_FLAGS="/INCREMENTAL:NO"
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build-asan

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure
