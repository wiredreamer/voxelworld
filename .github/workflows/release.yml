name: Release

on:
  push:
    tags: ['v*']

env:
  VW_CMAKE_VERSION: 4.4.0
  VW_LLVM_VERSION: 20

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Vulkan SDK
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: latest
          cache: true

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVW_BUILD_TESTS=OFF
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build sculptor
        run: cmake --build build --target sculptor

      - name: Package
        shell: bash
        run: |
          mkdir package
          cp build/apps/sculptor/sculptor.exe package/
          cp build/apps/sculptor/*.dll package/ 2>/dev/null || true
          cp -r build/apps/sculptor/shaders package/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sculptor-windows
          path: package/

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Clang and libc++
        run: |
          wget -qO llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ env.VW_LLVM_VERSION }}
          sudo apt-get install -y \
            libc++-${{ env.VW_LLVM_VERSION }}-dev \
            libc++abi-${{ env.VW_LLVM_VERSION }}-dev
          echo "CC=clang-${{ env.VW_LLVM_VERSION }}" >> "$GITHUB_ENV"
          echo "CXX=clang++-${{ env.VW_LLVM_VERSION }}" >> "$GITHUB_ENV"

      - name: Install windowing dependencies
        run: |
          sudo apt-get install -y \
            xorg-dev libxinerama-dev libxcursor-dev libxi-dev libxrandr-dev \
            libglu1-mesa-dev libxkbcommon-dev libwayland-dev wayland-protocols \
            extra-cmake-modules pkg-config

      - name: Install Vulkan SDK
        run: |
          wget -qO- https://packages.lunarg.com/lunarg-signing-key-pub.asc \
            | sudo tee /etc/apt/trusted.gpg.d/lunarg.asc > /dev/null
          sudo wget -qO /etc/apt/sources.list.d/lunarg-vulkan-noble.list \
            https://packages.lunarg.com/vulkan/lunarg-vulkan-noble.list
          sudo apt-get update
          sudo apt-get install -y vulkan-sdk
          echo "VULKAN_SDK=/usr" >> "$GITHUB_ENV"

      - name: Setup CMake and Ninja
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: ${{ env.VW_CMAKE_VERSION }}
          ninjaVersion: latest

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11

      - name: Configure
        run: >
          cmake -B build -S . -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DVW_BUILD_TESTS=OFF
          -DCMAKE_C_COMPILER=clang-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_COMPILER=clang++-${{ env.VW_LLVM_VERSION }}
          -DCMAKE_CXX_FLAGS=-stdlib=libc++
          -DCMAKE_EXE_LINKER_FLAGS=-stdlib=libc++
          -DVCPKG_TARGET_TRIPLET=x64-linux-libcxx
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets
          -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

      - name: Build sculptor
        run: cmake --build build --target sculptor

      - name: Package
        run: |
          mkdir package
          cp build/apps/sculptor/sculptor package/
          cp -r build/apps/sculptor/shaders package/
          tar -czf sculptor-${{ github.ref_name }}-linux.tar.gz -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sculptor-linux
          path: sculptor-${{ github.ref_name }}-linux.tar.gz

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4

      - name: Create zip archive
        run: cd sculptor-windows && zip -r ../sculptor-${{ github.ref_name }}-windows.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sculptor-${{ github.ref_name }}-windows.zip
            sculptor-linux/sculptor-${{ github.ref_name }}-linux.tar.gz
          generate_release_notes: true
